metadata:
  version: 1
  description: "Research Lab Data Catalog"

sources:
  qpesums:
    description: "QPESUMS Radar Mosaic (Silver)"
    driver: zarr
    args:
      urlpath: "/home/sungche/stac/data/qpesums/qpesums-*.zarr"
      consolidated: true
    metadata:
      tier: "silver"
      source: "CWA"
      constellation: "radar"
      gsd: 1300

  era5_convection:
    description: "ERA5 Convection Subset (Bronze/Silver)"
    driver: zarr
    args:
      urlpath: "/home/sungche/stac/data/era5/era5-convection-*.zarr"
      consolidated: true
    metadata:
      tier: "silver"
      source: "ECMWF"
      variables: ["u", "v", "w"]

  himawari_l2:
    description: "Himawari-8 L2 Products (Silver)"
    driver: zarr
    args:
      urlpath: "/home/sungche/stac/data/himawari/himawari-l2-*.zarr"
      consolidated: true
    metadata:
      tier: "silver"
      platform: "himawari-8"
      gsd: 500

  cwa_gauge:
    description: "CWA Rain Gauge Stations (Gold)"
    driver: csv 
    # Note: Using csv driver for simplicity in this example, but adapter will use DuckDB on the actual file.
    # In a real scenario with intake-sql, we might use that. 
    # For now, we point to the file and let the adapter handle the specific reading logic if needed,
    # or just use the path from here.
    args:
      urlpath: "/home/sungche/stac/data/cwa/gauge_station.sqlite"
    metadata:
      tier: "gold"
      source: "CWA"
      type: "tabular"
