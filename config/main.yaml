project:
  title: "水環境空間資訊整合與智慧防災應用平台"
  id: "stac-root-catalog"
  description: |
    國科會「水環境空間資訊整合與智慧防災應用平台建構計畫」資料目錄。

    本計畫聚焦於水環境議題，整合跨部會動靜態時空資料，建立問題導向的跨域整合平台，
    以提升對水環境議題的整體理解和應對能力。示範區域涵蓋台南鹽水溪與高雄布唐布那斯溪流域。

    應用場景包含：
    - **降雨即時預測**：基於雷達與衛星觀測之短延時預報
    - **坡地崩塌分級**：整合地貌、區位、地質與動態因子之崩塌潛勢評估
    - **淹水模擬**：中下游都市與流域尺度之水理模擬與驗證

filesystem:
  output_dir: "stac_catalog"
  static_dir: "stac_browser"

server:
  host: "0.0.0.0"
  port: 8001

grouping:
  strategy: "prefix"
  separator: "_"

concurrency:
  max_workers: 5

build:
  targets:
    - catalog: "config/catalogs/flood_modelling_intake_catalog.yaml"
      source: "flood_event_20210604_rainfall_wgs84"
    - catalog: "config/catalogs/flood_modelling_intake_catalog.yaml"
      source: "flood_event_20210604_depth_timeseries_zarr"
    - catalog: "config/catalogs/flood_modelling_intake_catalog.yaml"
      source: "flood_event_20210604_max_depth_faces"
    - catalog: "config/catalogs/flood_modelling_intake_catalog.yaml"
      source: "flood_event_20210604_iot_validation_parquet"
