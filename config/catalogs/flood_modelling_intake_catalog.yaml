metadata:
  catalog_name: "淹水模擬"
  description: "本計畫中下游應用場景之淹水模擬產品，以 D-Flow FM 水理模型模擬鹽水溪流域之事件型淹水，並以 IoT 淹水感測器進行空間精度驗證。"
  catalogs_keywords:
    - "淹水"
    - "水理模型"
    - "D-Flow FM"
    - "鹽水溪"
    - "事件模擬"
    - "IoT驗證"
    - "中下游"
    - "flood"
    - "inundation"
  version: 1
  license: "Internal Research Use"

sources:
  flood_event_20210604_rainfall_wgs84:
    driver: intake_xarray.netcdf.NetCDFSource
    description: "Gridded rainfall data for the 2021-06-04 flood event in WGS84 coordinate system."
    args:
      urlpath: "data/flood_modelling_products/event_20210604/forcing/rainfall_wgs84.nc"
      xarray_kwargs:
        engine: netcdf4
      chunks: {}
    metadata:
      id: "flood_event_20210604_rainfall_wgs84"
      collection_name: "網格雨量資料"
      category: "MODEL"
      description: |
        Time-series gridded rainfall data derived from QPESUMS weather radar products.
        This dataset provides the meteorological forcing input for the flood simulation model.
      keywords: ["precipitation", "rainfall", "meteorological forcing", "QPESUMS", "radar-derived", "gridded data", "model input"]
      source: "QPESUMS"
      processing_level: ["輸入資料", "分析就緒"]
      coordinate_system: "WGS84"
      event_id: "flood_event_20210604"
      event_title: "降雨事件 20210604"
      event_description: "2021-06-04 鹽水溪流域淹水模擬產品。"
      thumbnail_variable: "precipitation_observed"
      providers:
        - name: "臺北科技大學土木系"
          roles: ["host", "processor"]
          url: "https://wangup.caece.net/"

  flood_event_20210604_depth_timeseries_zarr:
    driver: zarr
    description: "Time-series water depth data from hydrodynamic flood simulation on 1D/2D flexible mesh."
    args:
      urlpath: "data/flood_modelling_products/event_20210604/results/fm_map_core.zarr"
      consolidated: true
    metadata:
      id: "flood_event_20210604_depth_timeseries_zarr"
      collection_name: "模擬水深時序列"
      category: "MODEL"
      description: |
        Spatially-distributed water depth at each model timestep across the entire computational domain.
        The dataset includes:
        - 2D mesh face water depths for overland flooding
        - 1D mesh node water depths for channel flow
      keywords: ["flood depth", "water depth", "inundation", "hydrodynamic simulation", "D-Flow FM", "flexible mesh", "1D/2D coupled", "map output", "time series"]
      source: "D-Flow FM"
      processing_level: ["模型輸出", "分析就緒"]
      coordinate_system: "TWD97 / EPSG:3826"
      event_id: "flood_event_20210604"
      event_title: "降雨事件 20210604"
      event_description: "2021-06-04 鹽水溪流域淹水模擬產品。"
      thumbnail_variable: "Mesh2d_waterdepth"
      providers:
        - name: "臺北科技大學土木系"
          roles: ["host", "processor"]
          url: "https://wangup.caece.net/"

  flood_event_20210604_max_depth_faces:
    driver: intake_xarray.netcdf.NetCDFSource
    description: "Maximum flood depth reached during the event at each grid cell."
    args:
      urlpath: "data/flood_modelling_products/event_20210604/results/max_depth_faces.nc"
      xarray_kwargs:
        engine: netcdf4
      chunks: {}
    metadata:
      id: "flood_event_20210604_max_depth_faces"
      collection_name: "最大淹水深度"
      category: "MODEL"
      description: |
        Spatial map of the maximum water depth experienced at each location throughout the entire simulation period.
        This product is useful for flood hazard assessment and identifying areas of greatest inundation risk.
      keywords: ["flood depth", "maximum inundation", "flood extent", "statistical output", "D-Flow FM", "fourier analysis", "derived product"]
      source: "D-Flow FM"
      processing_level: ["模型輸出", "衍生產品"]
      coordinate_system: "TWD97 / EPSG:3826"
      event_id: "flood_event_20210604"
      event_title: "降雨事件 20210604"
      event_description: "2021-06-04 鹽水溪流域淹水模擬產品。"
      thumbnail_variable: "max_depth"
      providers:
        - name: "臺北科技大學土木系"
          roles: ["host", "processor"]

  flood_event_20210604_iot_validation_parquet:
    driver: csv
    description: "Model validation dataset comparing simulated flood depths with in-situ sensor observations."
    args:
      urlpath: "data/flood_modelling_products/event_20210604/validation/iot_validation_timeseries_tidy.csv"
    metadata:
      id: "flood_event_20210604_iot_validation_parquet"
      collection_name: "感測器比對資料"
      category: "OBSERVATION"
      description: |
        Time-series comparison of observed versus simulated flood depths at IoT sensor locations.
        Model values are extracted from a 5x5 grid (25m buffer) around each sensor location,
        selecting the grid cell with values closest to observations.
        This dataset enables quantitative assessment of model performance and accuracy.
      table_parquet_path: "data/flood_modelling_products/event_20210604/validation/iot_validation_timeseries.parquet"
      keywords: ["flood depth", "in-situ measurement", "model validation", "IoT sensor", "point observation", "model-observation comparison", "performance metrics", "25m buffer"]
      source: "臺北科技大學土木系 D-Flow FM +  CIoT"
      processing_level: ["驗證", "分析就緒"]
      coordinate_system: "TWD97 / EPSG:3826"
      event_id: "flood_event_20210604"
      event_title: "降雨事件 20210604"
      event_description: "2021-06-04 鹽水溪流域淹水模擬產品。"
      thumbnail_variable: "simulated_depth"
      providers:
        - name: "臺北科技大學土木系"
          roles: ["host", "processor"]
          url: "https://wangup.caece.net/"

