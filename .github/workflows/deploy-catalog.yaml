name: Deploy STAC Catalog to GitHub Pages

on:
  push:
    tags:
      - 'v*'  # Trigger on version tags (e.g., v0.1.1, v0.2.0)

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Build STAC Browser
        run: |
          cd stac_browser
          npm install
          npm run build
      
      - name: Prepare Catalog for Deployment
        run: |
          # Use STAC Browser dist as base
          mkdir -p deploy
          cp -r stac_browser/dist/* deploy/
          
          # Copy STAC catalog files into deploy root
          cp -r stac_catalog/* deploy/
          
          # Create config.js for STAC Browser
          cat > deploy/config.js << 'EOF'
          module.exports = {
              catalogUrl: "./catalog.json",
              catalogTitle: "NTU CompHydroMet Lab Data Catalog",
              allowExternalAccess: true,
              pathPrefix: "/wangup-stac-manager/",
              historyMode: "hash"
          };
          EOF
          
          # Create public README
          cat > deploy/README.md << 'EOF'
          # NTU CompHydroMet Lab - Data Catalog
          
          **Public STAC catalog for research datasets**
          
          Visit: [STAC Browser](https://ntu-comphydromet-lab.github.io/wangup-stac-manager/)
          
          ## Available Datasets
          
          - **Himawari-8/9 Cloud Properties**: High-resolution cloud products over Taiwan
          - **ERA5 Reanalysis**: ECMWF atmospheric data for East Asia
          - **IMERG Precipitation**: NASA GPM satellite estimates
          - **QPESUMS**: Taiwan radar-based precipitation
          
          ## Data Access
          
          Metadata is publicly available. Data files are hosted on our internal NAS.
          
          For research collaboration and data access, contact:
          - Repository: [wangup-stac-manager](https://github.com/NTU-CompHydroMet-Lab/wangup-stac-manager)
          - Institution: National Taiwan University, Computational Hydrometeorology Lab
          
          ## Technical Details
          
          This catalog follows [STAC v1.1.0](https://stacspec.org/) specification.
          
          Generated by: [wangup-stac-manager](https://github.com/NTU-CompHydroMet-Lab/wangup-stac-manager)
          EOF
      
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true
          commit_message: "Deploy catalog from ${{ github.ref_name }}"
