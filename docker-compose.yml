version: '3'
services:
  database:
    image: ghcr.io/stac-utils/pgstac:v0.9.2
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgis
      - PGUSER=username
      - PGPASSWORD=password
      - PGHOST=localhost
    ports:
      - "5432:5432"
    command: postgres -N 500

  stac-fastapi:
    image: ghcr.io/stac-utils/stac-fastapi-pgstac:latest
    environment:
      - POSTGRES_USER=username
      - POSTGRES_PASSWORD=password
      - POSTGRES_DB=postgis
      - POSTGRES_HOST=database
      - POSTGRES_PORT=5432
      - DB_MIN_CONN_SIZE=1
      - DB_MAX_CONN_SIZE=10
      - USE_API_HYDRA=true
    ports:
      - "8080:8080"
    depends_on:
      - database
    command: uvicorn stac_fastapi.pgstac.app:app --host 0.0.0.0 --port 8080
